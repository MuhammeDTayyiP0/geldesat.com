[variables]
NIXPACKS_NODE_VERSION = "22"
NITRO_PRESET = "node-server"
VITE_AUTH_ENABLED = "true"
VITE_SELF_HOST = "true"
HOST = "0.0.0.0"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build:node"]

[start]
cmd = "node scripts/migrate.mjs && node .output/server/index.mjs"
