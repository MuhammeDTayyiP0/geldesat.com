name: Build Unsigned iOS IPA

# Builds mobile-app/ (Expo SDK 58) into an unsigned IPA for sideloading
# (Sideloadly / AltStore sign it with the tester's own Apple ID). The JS bundle
# is embedded, so the app runs on its own and talks to www.geldesat.com.
on:
  push:
    branches:
      - main
      - master
    paths:
      - "mobile-app/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile-app
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Expo SDK 58 requires Node 22.13 or newer.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      # A free Apple ID cannot sign push notifications or associated domains,
      # and sideloading fails if the app asks for them. Test builds drop them.
      - name: Remove entitlements a free Apple ID cannot sign
        run: |
          set -e
          for file in $(find ios -maxdepth 2 -name "*.entitlements"); do
            echo "Clearing $file"
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$file" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.associated-domains" "$file" 2>/dev/null || true
            cat "$file"
          done

      - name: Install CocoaPods
        working-directory: mobile-app/ios
        run: pod install

      - name: Detect workspace and scheme
        run: |
          set -e
          WORKSPACE=$(find ios -maxdepth 1 -type d -name "*.xcworkspace" -print -quit)
          XCODEPROJ=$(find ios -maxdepth 1 -type d -name "*.xcodeproj" -print -quit)
          if [ -z "$WORKSPACE" ] || [ -z "$XCODEPROJ" ]; then
            echo "HATA: iOS projesi bulunamadi"
            find ios -maxdepth 2 -print
            exit 1
          fi
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
          echo "Workspace: $WORKSPACE"
          echo "Scheme:    $SCHEME"
          echo "IOS_WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "IOS_SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Archive (unsigned)
        run: |
          set -e
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/mobile-app/build/geldesat.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive > xcodebuild.log 2>&1 || { grep -E "error:" xcodebuild.log | head -n 50; tail -n 150 xcodebuild.log; exit 1; }
          tail -n 5 xcodebuild.log

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/geldesat.xcarchive/Products/Applications -maxdepth 1 -type d -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "HATA: archive icinde .app bulunamadi"
            find build/geldesat.xcarchive/Products -maxdepth 4 -print
            exit 1
          fi
          rm -rf Payload geldesat-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry geldesat-unsigned.ipa Payload
          unzip -Z1 geldesat-unsigned.ipa | grep -qE '^Payload/[^/]+\.app/' || { echo "HATA: IPA bos"; exit 1; }
          ls -lh geldesat-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: geldesat-ios-unsigned
          path: mobile-app/geldesat-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: mobile-app/xcodebuild.log
          if-no-files-found: ignore
