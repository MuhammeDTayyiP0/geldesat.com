name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        run: |
          cd mobile
          npm ci

      - name: Setup Expo / EAS CLI
        run: |
          npm install -g expo-cli eas-cli

      - name: Generate iOS Native Project (Prebuild)
        run: |
          cd mobile
          npx expo prebuild --platform ios --clean

      - name: Build iOS App (Unsigned)
        run: |
          cd mobile
          WORKSPACE=$(ls -d ios/*.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "HATA: ios klasoru icinde .xcworkspace bulunamadi!"
            ls -la
            exit 1
          fi
          
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          
          echo "Bulunan Workspace: $WORKSPACE"
          echo "Bulunan Scheme: $SCHEME"

          # Output yolunu GH Workspace bazli mutlak yol yapıyoruz
          BUILD_DIR="$GITHUB_WORKSPACE/mobile/build"

          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath "$BUILD_DIR" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     build

      - name: Package Unsigned IPA
        run: |
          cd mobile
          mkdir -p Payload
          
          BUILD_DIR="$GITHUB_WORKSPACE/mobile/build"
          
          # Derlenen .app dosyasini arama
          APP_PATH=$(find "$BUILD_DIR" -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          
          # Alternatif olarak tum sistem DerivedData icinde arama (fallback)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          fi

          echo "Secilen App Yolu: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app dosyasi bulunamadi!"
            echo "Mevcut build klasoru icerigi:"
            ls -R "$BUILD_DIR" 2>/dev/null || echo "Build klasoru yok"
            exit 1
          fi

          cp -R "$APP_PATH" Payload/
          zip -r geldesat-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geldesat-ios-app
          path: mobile/geldesat-unsigned.ipa