name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate iOS Native Project
        run: npx expo prebuild --platform ios

      - name: Build iOS App Archive
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          
          echo "Bulunan Workspace: $WORKSPACE"
          echo "Bulunan Scheme: $SCHEME"

          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/App.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     archive

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          # Archive icindeki .app dosyasini Payload'a kopyala
          APP_PATH=$(find ios/build/App.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "Bulunan App Yolu: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app dosyasi archive icinde bulunamadi!"
            exit 1
          fi

          cp -R "$APP_PATH" Payload/
          zip -r geldesat-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geldesat-ios-app
          path: mobile/geldesat-unsigned.ipa