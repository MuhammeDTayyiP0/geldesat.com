name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate iOS Native Project
        run: npx expo prebuild --platform ios

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Build iOS Archive (Unsigned)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          
          echo "Bulunan Workspace: $WORKSPACE"
          echo "Bulunan Scheme: $SCHEME"

          mkdir -p build

          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath "$PWD/build/geldesat.xcarchive" \
                     SKIP_INSTALL=NO \
                     BUILD_DIR="$PWD/build" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     archive

      - name: Package Unsigned IPA from Archive
        run: |
          mkdir -p Payload
          
          echo "=== Taranan .app Dosyalari ==="
          find /Users/runner/Library/Developer/Xcode/DerivedData "$PWD" -name "*.app" -type d 2>/dev/null || true
          echo "=============================="

          # 1. Öncelik: xcarchive icindeki .app
          APP_PATH=$(find "$PWD/build/geldesat.xcarchive" -name "*.app" -type d 2>/dev/null | head -n 1)
          
          # 2. Öncelik: build klasorundeki Release-iphoneos icindeki .app
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$PWD/build" -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          fi

          # 3. Öncelik: DerivedData icindeki .app
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          fi

          # 4. Son Çare: Herhangi bir .app
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$PWD" -name "*.app" -type d | head -n 1)
          fi

          echo "Seçilen App Yolu: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "HATA: Sistemde hicbir .app dosyasi bulunamadi!"
            exit 1
          fi

          # .app dosyasini Payload klasorune kopyala ve .ipa olarak ziple
          cp -R "$APP_PATH" Payload/
          zip -r geldesat-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geldesat-ios-app
          path: mobile/geldesat-unsigned.ipa