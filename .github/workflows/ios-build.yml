name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate iOS Native Project
        run: npx expo prebuild --platform ios

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Build iOS App (Unsigned)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          
          echo "Bulunan Workspace: $WORKSPACE"
          echo "Bulunan Scheme: $SCHEME"

          # Imzasiz Build Komutu
          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath "$PWD/build" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     build

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          
          # Build klasoru altindaki .app dosyasini bul
          APP_PATH=$(find "$PWD/build" -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            # Alternatif arama
            APP_PATH=$(find "$PWD/build" -name "*.app" -type d | head -n 1)
          fi

          echo "Seçilen App Yolu: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app dosyasi derlenemedi! Lutfen yukaridaki Build adiminin loglarini kontrol edin."
            exit 1
          fi

          # .app dosyasini Payload klasorune kopyala ve .ipa olarak ziple
          cp -R "$APP_PATH" Payload/
          zip -r geldesat-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geldesat-ios-app
          path: mobile/geldesat-unsigned.ipa