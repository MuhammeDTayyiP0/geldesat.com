name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # GitHub arayüzünden manuel tetikleme butonu ekler

jobs:
  build-ios:
    runs-on: macos-latest

    # Tüm adımların 'mobile' alt klasörü içinde çalışmasını sağlar
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate iOS Native Project
        run: npx expo prebuild --platform ios

      - name: Build iOS App (Unsigned IPA)
        run: |
          cd ios
          xcodebuild -workspace *.xcworkspace \
                     -scheme geldesat \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          mv ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r geldesat-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geldesat-ios-app
          path: mobile/geldesat-unsigned.ipa