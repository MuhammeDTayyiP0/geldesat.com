services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: geldesat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: geldesat
    volumes:
      - geldesat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geldesat -d geldesat"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      args:
        VITE_GOOGLE_AUTH_ENABLED: ${VITE_GOOGLE_AUTH_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GELDESAT_PORT:-3000}:3000"
    environment:
      # POSTGRES_PASSWORD URL-reserved karakterler (@ : / # % ?) içermemelidir.
      DATABASE_URL: postgres://geldesat:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@db:5432/geldesat
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OTA_PUBLISH_TOKEN: ${OTA_PUBLISH_TOKEN:-}
      OTA_CODE_SIGNING_PRIVATE_KEY: ${OTA_CODE_SIGNING_PRIVATE_KEY:-}
      OTA_CODE_SIGNING_KEY_ID: ${OTA_CODE_SIGNING_KEY_ID:-}
      CRON_SECRET: ${CRON_SECRET:-}
      TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      ANDROID_SHA256_FINGERPRINTS: ${ANDROID_SHA256_FINGERPRINTS:-}
      HOST: "0.0.0.0"
      PORT: "3000"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  geldesat_pg:
