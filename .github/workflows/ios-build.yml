name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # 2. Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # ==========================================
      # 3. Install Dependencies
      # ==========================================
      - name: Install Dependencies
        working-directory: mobile
        run: |
          npm ci

      # ==========================================
      # 4. Setup Expo CLI
      # ==========================================
      - name: Setup Expo CLI
        run: |
          npm install -g expo-cli

      # ==========================================
      # 5. Generate iOS Native Project
      # ==========================================
      - name: Generate iOS Native Project
        working-directory: mobile
        run: |
          npx expo prebuild --platform ios --clean

      # ==========================================
      # 6. Build iOS App
      # ==========================================
      - name: Build iOS App
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/mobile"

          echo "========================================="
          echo "iOS WORKSPACE ARANIYOR"
          echo "========================================="

          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -type d -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "HATA: .xcworkspace bulunamadi!"
            find ios -maxdepth 2 -print
            exit 1
          fi

          echo "Workspace: $WORKSPACE"

          echo "========================================="
          echo "SCHEME ARANIYOR"
          echo "========================================="

          SCHEME=$(
            xcodebuild \
              -workspace "$WORKSPACE" \
              -list \
              | awk '
                /Schemes:/ {
                  found=1
                  next
                }
                found && NF {
                  print
                  exit
                }
              ' \
              | xargs
          )

          if [ -z "$SCHEME" ]; then
            echo "HATA: Scheme bulunamadi!"
            xcodebuild -workspace "$WORKSPACE" -list
            exit 1
          fi

          echo "Scheme: $SCHEME"

          echo "========================================="
          echo "BUILD KLASORLERI HAZIRLANIYOR"
          echo "========================================="

          BUILD_DIR="$GITHUB_WORKSPACE/mobile/build"
          PRODUCTS_DIR="$BUILD_DIR/Products"

          rm -rf "$BUILD_DIR"

          mkdir -p "$PRODUCTS_DIR"

          echo "Build Directory:"
          echo "$BUILD_DIR"

          echo ""
          echo "Products Directory:"
          echo "$PRODUCTS_DIR"

          echo "========================================="
          echo "XCODE BUILD BASLIYOR"
          echo "========================================="

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$BUILD_DIR/DerivedData" \
            CONFIGURATION_BUILD_DIR="$PRODUCTS_DIR" \
            SYMROOT="$BUILD_DIR/SymRoot" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          echo ""
          echo "========================================="
          echo "XCODE BUILD BASARILI"
          echo "========================================="

          echo ""
          echo "========================================="
          echo "PRODUCTS KLASORU"
          echo "========================================="

          if [ -d "$PRODUCTS_DIR" ]; then
            find "$PRODUCTS_DIR" -maxdepth 3 -print
          else
            echo "HATA: Products klasoru olusmadi!"
            exit 1
          fi

          echo ""
          echo "========================================="
          echo "APP DOSYASI ARANIYOR"
          echo "========================================="

          APP_PATH=$(find "$PRODUCTS_DIR" -type d -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo ""
            echo "HATA: Xcode BUILD SUCCEEDED dedi fakat .app bulunamadi!"
            echo ""
            echo "Products:"
            find "$PRODUCTS_DIR" -maxdepth 5 -print
            echo ""
            echo "DerivedData:"
            find "$BUILD_DIR/DerivedData" -maxdepth 8 -type d -name "*.app" -print 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "APP BULUNDU:"
          echo "$APP_PATH"

          echo ""
          echo "APP BOYUTU:"
          du -sh "$APP_PATH"

          echo ""
          echo "========================================="
          echo "BUILD TAMAMLANDI"
          echo "========================================="

      # ==========================================
      # 7. Package Unsigned IPA
      # ==========================================
      - name: Package Unsigned IPA
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/mobile"

          BUILD_DIR="$GITHUB_WORKSPACE/mobile/build"
          PRODUCTS_DIR="$BUILD_DIR/Products"
          PAYLOAD_DIR="$GITHUB_WORKSPACE/mobile/Payload"
          IPA_PATH="$GITHUB_WORKSPACE/mobile/geldesat-unsigned.ipa"

          echo "========================================="
          echo "APP DOSYASI BULUNUYOR"
          echo "========================================="

          APP_PATH=$(find "$PRODUCTS_DIR" -type d -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app bulunamadi!"
            echo ""
            echo "Products klasoru:"
            find "$PRODUCTS_DIR" -maxdepth 5 -print
            exit 1
          fi

          echo "App:"
          echo "$APP_PATH"

          echo ""
          echo "========================================="
          echo "APP KONTROL"
          echo "========================================="

          ls -lah "$APP_PATH"

          echo ""
          echo "========================================="
          echo "PAYLOAD HAZIRLANIYOR"
          echo "========================================="

          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"

          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          echo "Payload:"
          ls -lah "$PAYLOAD_DIR"

          echo ""
          echo "========================================="
          echo "IPA OLUSTURULUYOR"
          echo "========================================="

          rm -f "$IPA_PATH"

          cd "$GITHUB_WORKSPACE/mobile"

          zip -qry "$IPA_PATH" Payload

          echo ""
          echo "========================================="
          echo "IPA OLUSTURULDU"
          echo "========================================="

          if [ ! -f "$IPA_PATH" ]; then
            echo "HATA: IPA olusturulamadi!"
            exit 1
          fi

          ls -lh "$IPA_PATH"

      # ==========================================
      # 8. Verify IPA
      # ==========================================
      - name: Verify IPA
        shell: bash
        run: |
          set -e

          IPA_PATH="$GITHUB_WORKSPACE/mobile/geldesat-unsigned.ipa"

          echo "========================================="
          echo "IPA KONTROL EDILIYOR"
          echo "========================================="

          if [ ! -f "$IPA_PATH" ]; then
            echo "HATA: IPA bulunamadi!"
            exit 1
          fi

          echo "IPA:"
          ls -lh "$IPA_PATH"

          echo ""
          echo "IPA ICERIGI:"
          unzip -l "$IPA_PATH" | sed -n '1,100p'

          echo ""
          echo "IPA KONTROL BASARILI"

      # ==========================================
      # 9. Upload IPA
      # ==========================================
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geldesat-ios-app
          path: mobile/geldesat-unsigned.ipa
          if-no-files-found: error
