name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate iOS Native Project
        run: npx expo prebuild --platform ios

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Build Unsigned IPA with Fastlane
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          fastlane run build_app \
            workspace:"$WORKSPACE" \
            scheme:"$SCHEME" \
            skip_build_archive:false \
            skip_package_ipa:false \
            skip_profile_detection:true \
            export_method:"development" \
            skip_codesigning:true \
            output_directory:"../build" \
            output_name:"geldesat-unsigned.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geldesat-ios-app
          path: mobile/build/geldesat-unsigned.ipa